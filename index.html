<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tu Tiên Hồng Hoang Chi Giới</title>
    <link rel="stylesheet" href="style.css?v=20261101_180026_9fJaRn">
</head>

<body data-game-version="20261101_180026_9fJaRn">
    <div id="toastLayer" aria-live="polite"></div>
    <div id="confirmLayer"></div>
    <div class="app">
        <!-- 🧙‍♂️ Màn nhập tên khởi đầu -->
        <div id="start-screen">
            <h1 style="font-size: 2.2em; margin-bottom: 1em;">Tu Tiên Hồng Hoang Chi Giới</h1>
            <p style="margin-bottom: 0.5em; font-style: italic;">Nhập danh xưng của ngươi để bước vào con đường tu
                đạo...</p>
            <input id="playerNameInput" type="text" maxlength="20" placeholder="Ví dụ: Thiên Đạo đại nhân"
                style="padding: 0.5em 1em; font-size: 1.1em; border-radius: 6px; border: none; text-align: center; width: 260px;">
            <div id="creatorHost"></div>
            <button id="startBtn" style="margin-top: 1em; padding: 0.6em 1.2em; font-size: 1em; border-radius: 8px;
                 background: #7b5633; color: #fff; border: none; cursor: pointer;">
                Bắt đầu tu luyện
            </button>
            <div id="introNarration"></div>
        </div>

        <header>
            <h1>Tu Tiên Hồng Hoang Chi Giới</h1>
            <div class="small" id="gameVersion"></div>
            <div class="controls">
                <button id="saveBtn">Lưu</button>
                <button id="loadBtn">Tải</button>
                <button id="openLook">Ngoại hình</button>
                <button onclick="openGuide()">❓ Hướng dẫn</button>
                <button onclick="toggleTestPanel()">🧪 Test</button>
                <button id="clearStorage">Bắt đầu lại</button>
            </div>
        </header>

        <div class="topline" id="statsTop"></div>
        <div class="activity-bar" id="activityBar" role="status"></div>
        <div class="panel test-panel" id="testPanel" style="display:none"></div>

        <div class="grid">
            <main class="stage">
                <div class="panel panel-world">
                    <div id="locationPanel"></div>
                    <div id="worldViewTabs" class="filter-chips"></div>
                    <div id="sceneHost"></div>
                    <div id="worldMap"></div>
                </div>
            </main>

            <aside class="side">
                <nav class="side-tabs" id="sideTabs" aria-label="Bảng chức năng">
                    <button data-tab="hero" onclick="setSideTab('hero')">🧙 Nhân vật</button>
                    <button data-tab="board" onclick="setSideTab('board')">🎴 Trận pháp</button>
                    <button data-tab="bag" onclick="setSideTab('bag')">🎒 Túi đồ</button>
                    <button data-tab="quest" onclick="setSideTab('quest')">📜 Nhiệm vụ</button>
                    <button data-tab="sect" onclick="setSideTab('sect')">⛩️ Tông môn</button>
                    <button data-tab="friends" onclick="setSideTab('friends')">👥 Bạn bè</button>
                    <button data-tab="log" class="side-tab-log" onclick="setSideTab('log')">📖 Nhật ký</button>
                </nav>

                <div class="side-pane">
                    <div class="panel panel-hero" data-tab="hero">
                        <strong>Hình tượng & Trang bị</strong>
                        <div id="appearancePanel"></div>
                    </div>
                    <div class="panel panel-realm" data-tab="hero">
                        <strong>Hệ cảnh giới & Linh căn</strong>
                        <div id="realms"></div>
                        <div id="rootTable" class="small"></div>
                    </div>
                    <div class="panel panel-combat" data-tab="board">
                        <button id="runBtn" class="mini-btn" style="display:none">Chạy khỏi trận</button>
                        <div id="battleInfo" class="small"></div>
                        <div id="boardArena" class="board-arena"></div>
                    </div>
                    <div class="panel panel-inventory" data-tab="bag">
                        <strong>Kho đồ & Hỗn nguyên</strong>
                        <div class="small">Nhấn vật Phẩm để dùng / trang bị / hợp linh căn.</div>
                        <div class="items" id="inventory"></div>
                    </div>
                    <div class="panel panel-quest" data-tab="quest">
                        <strong>Nhiệm vụ</strong>
                        <div id="questPanel"></div>
                    </div>
                    <div class="panel panel-sect" data-tab="sect">
                        <strong>Tông môn của ta</strong>
                        <div id="sectPanel"></div>
                    </div>
                    <div class="panel panel-room" data-tab="sect">
                        <strong>Phòng tổ đội</strong>
                        <div id="roomPanel"></div>
                    </div>
                    <div class="panel panel-friends" data-tab="friends">
                        <div id="friendsPanel"></div>
                    </div>
                </div>

                <div class="panel panel-log panel-log-small" data-tab="log">
                    <strong>Nhật ký tu luyện</strong>
                    <div class="log" id="log"></div>
                </div>
            </aside>
        </div>

    </div>
    <div id="dialogueLayer"></div>
    <script src="js/world/balance.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/world/avatar.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/world/atlas.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/world/storyline.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/world/storyscenes.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/world/renown.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/base/cultivation.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/exploring/shop.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/combat/enemy.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/combat/bonus.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/combat/dmgCalculate.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/combat/fight.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/combat/board.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/exploring/explore.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/exploring/saint.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/base/story.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/social/chat.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/social/playersect.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/social/presence.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/social/ranked.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/social/worldboss.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/social/coop.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/social/friends.js?v=20261101_180026_9fJaRn"></script>

    <script src="js/base/core.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/world/world.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/world/tienvi.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/world/guide.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/world/blackmarket.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/world/scene.js?v=20261101_180026_9fJaRn"></script>
    <script src="js/world/shell.js?v=20261101_180026_9fJaRn"></script>
</body>

</html>
