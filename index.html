<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tu Tiên Hồng Hoang Chi Giới</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-game-version="20251104_204734_3t1V3w">
    <div id="toastLayer" aria-live="polite"></div>
    <div id="confirmLayer"></div>
    <div class="app">
        <!-- 🧙‍♂️ Màn nhập tên khởi đầu -->
        <div id="start-screen">
            <h1 style="font-size: 2.2em; margin-bottom: 1em;">Tu Tiên Hồng Hoang Chi Giới</h1>
            <p style="margin-bottom: 0.5em; font-style: italic;">Nhập danh xưng của ngươi để bước vào con đường tu
                đạo...</p>
            <input id="playerNameInput" type="text" maxlength="20" placeholder="Ví dụ: Thiên Đạo đại nhân"
                style="padding: 0.5em 1em; font-size: 1.1em; border-radius: 6px; border: none; text-align: center; width: 260px;">
            <button id="startBtn" style="margin-top: 1em; padding: 0.6em 1.2em; font-size: 1em; border-radius: 8px;
                 background: #7b5633; color: #fff; border: none; cursor: pointer;">
                Bắt đầu tu luyện
            </button>
            <div id="introNarration"></div>
        </div>

        <header>
            <h1>Tu Tiên Hồng Hoang Chi Giới</h1>
            <div class="small" id="gameVersion"></div>
        </header>

        <div class="topline" id="statsTop"></div>

        <div class="controls">
            <button id="toggleAuto" class="primary">Bắt đầu tu luyện auto</button>
            <button id="explore">Đi kỳ ngộ</button>
            <button id="runBtn">Chạy (−15% tu vi)</button>
            <button id="findMatch">Tìm đối thủ PvP</button>
            <button id="saveBtn">Lưu</button>
            <button id="loadBtn">Tải</button>
            <button id="toggleXpLog">Tắt log tu vi</button>
            <button id="openShop">Mở cửa hàng</button>
            <button id="clearStorage">Bắt đầu lại</button>
        </div>

        <div class="grid">
            <!-- Left column: Chiến đấu, Kho đồ, Công pháp -->
            <div>
                <div class="panel panel-combat">
                    <strong>Chiến đấu</strong>
                    <div class="small">Kẻ thù hiện tại:</div>
                    <div id="currentEnemy" class="enemy-box">Không có</div>
                    <div style="margin-top:8px" id="battleInfo" class="small"></div>
                    <div id="boardArena" class="board-arena"></div>
                </div>

                <div class="panel panel-inventory" style="margin-top:12px">
                    <strong>Kho đồ & Hỗn nguyên</strong>
                    <div class="small">Nhấn vật Phẩm để dùng / trang bị / hợp linh căn.</div>
                    <div class="items" id="inventory"></div>
                </div>
            </div>

            <!-- Right column: Nhật ký (small), Hệ cảnh giới, Bạn bè -->
            <div>
                <div class="panel panel-log panel-log-small">
                    <strong>Nhật ký tu luyện</strong>
                    <div class="log" id="log"></div>
                </div>

                <div class="panel panel-realm" style="margin-top:12px">
                    <strong>Hệ cảnh giới & Linh căn</strong>
                    <div id="realms"></div>
                    <div id="rootTable" class="small" style="margin-top:8px"></div>
                </div>

                <!-- Bạn bè -->
                <div class="panel panel-friends" style="margin-top:12px">
                    <div id="friendsPanel"></div>
                </div>
            </div>
        </div>

    </div>
    <script src="js/base/cultivation.js"></script>
    <script src="js/exploring/shop.js"></script>
    <script src="js/combat/enemy.js"></script>
    <script src="js/combat/bonus.js"></script>
    <script src="js/combat/dmgCalculate.js"></script>
    <script src="js/combat/fight.js"></script>
    <script src="js/combat/board.js"></script>
    <script src="js/combat/skill.js"></script>
    <script src="js/exploring/explore.js"></script>
    <script src="js/exploring/saint.js"></script>
    <script src="js/base/story.js"></script>
    <script src="js/social/friends.js"></script>

    <script src="js/base/core.js"></script>
</body>

</html>
